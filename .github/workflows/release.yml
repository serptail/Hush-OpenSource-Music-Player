name: release
# Builds a signed APK and publishes it as a GitHub release, plus latest.json, which is what the app checks on launch.
# Started by hand (Actions > release > Run workflow) or by extractor-bump.yml after a successful library bump.
on:
  workflow_dispatch:
    inputs:
      force_min:
        description: "Force every user onto this build (the app refuses to run older ones)"
        type: boolean
        default: true
      notes:
        description: "Shown on the update screen"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Optional: publish to a different (public) repo. Set the RELEASE_REPO variable and the RELEASES_TOKEN secret.
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.GAMUT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret GAMUT_KEYSTORE_BASE64 is missing. Every release must be signed with the same key, or installed apps cannot be updated."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gamut.keystore"
          echo "GAMUT_KEYSTORE_FILE=$RUNNER_TEMP/gamut.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          GAMUT_KEYSTORE_PASSWORD: ${{ secrets.GAMUT_KEYSTORE_PASSWORD }}
          GAMUT_KEY_ALIAS: ${{ secrets.GAMUT_KEY_ALIAS }}
          GAMUT_KEY_PASSWORD: ${{ secrets.GAMUT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          code=$(( ${{ github.run_number }} + 100 ))   # always above local builds (versionCode 1)
          echo "CODE=$code" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease --no-daemon \
            -Pgamut.versionCode=$code -Pgamut.versionName=1.0.$code -Pgamut.repo="$RELEASE_REPO" \
            -Pgamut.abis="${{ vars.RELEASE_ABIS || 'arm64-v8a,armeabi-v7a' }}"

      - name: Package
        env:
          FORCE_MIN: ${{ inputs.force_min }}
          NOTES: ${{ inputs.notes }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          case "$apk" in *unsigned*) echo "::error::The APK is unsigned"; exit 1;; esac
          # Fail the release if it is not signed with the key we think it is.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner" verify --print-certs "$apk" | head -n 3
          cp "$apk" "Gamut-$CODE.apk"

          min=$CODE
          if [ "$FORCE_MIN" != "true" ]; then
            # A soft release: keep whatever minimum is already in force.
            prev=$(curl -fsSL "https://github.com/$RELEASE_REPO/releases/latest/download/latest.json" | jq -r '.minVersionCode' || true)
            if [[ "$prev" =~ ^[0-9]+$ ]]; then min=$prev; fi
          fi

          jq -n \
            --argjson code "$CODE" \
            --arg name "1.0.$CODE" \
            --arg url "https://github.com/$RELEASE_REPO/releases/download/v1.0.$CODE/Gamut-$CODE.apk" \
            --arg sha "$(sha256sum "Gamut-$CODE.apk" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "Gamut-$CODE.apk")" \
            --argjson min "$min" \
            --arg notes "$NOTES" \
            '{versionCode:$code, versionName:$name, apkUrl:$url, sha256:$sha, sizeBytes:$size, minVersionCode:$min, notes:$notes}' \
            > latest.json
          cat latest.json

      - name: Publish
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v1.0.$CODE" "Gamut-$CODE.apk" latest.json \
            --repo "$RELEASE_REPO" --title "Gamut 1.0.$CODE" --notes "${NOTES:-Automatic build.}" --latest
